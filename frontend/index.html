<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReguFlow | CDSCO Smart Suite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; font-family: 'Inter', sans-serif; }
        .glass-card { 
            background: rgba(255, 255, 255, 0.95); 
            border-radius: 20px; 
            border: none;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            backdrop-filter: blur(10px);
        }
        .header-section { background: #004a99; color: white; border-radius: 20px 20px 0 0; padding: 2rem; }
        .btn-medical { background: #004a99; color: white; transition: 0.3s; border: none; padding: 12px; }
        .btn-medical:hover { background: #003366; transform: translateY(-2px); color: white; }
        .result-box { border-left: 5px solid #004a99; background: #f8f9fa; border-radius: 8px; }
        .form-switch .form-check-input { width: 3em; height: 1.5em; cursor: pointer; }
    </style>
</head>
<body class="p-3 p-md-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="glass-card">
                    <div class="header-section text-center">
                        <h1 class="fw-bold m-0">ReguFlow</h1>
                        <p class="opacity-75 m-0">BME Regulatory Decision Support System</p>
                    </div>
                    
                    <div class="p-4 p-md-5">
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Medical Device Name</label>
                            <input type="text" id="dName" class="form-control form-control-lg shadow-sm" placeholder="Enter device name...">
                        </div>

                        <div class="row g-4">
                            <div class="col-md-6">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="dInvasive">
                                    <label class="form-check-label ms-2">Invasive/Surgical</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="dActive">
                                    <label class="form-check-label ms-2">Active/Powered</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="dLife">
                                    <label class="form-check-label ms-2">Life Sustaining</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="dCNS">
                                    <label class="form-check-label ms-2">Contacts Heart/CNS</label>
                                </div>
                            </div>
                        </div>

                        <button onclick="submitLogic()" class="btn btn-medical w-100 mt-5 fw-bold shadow">
                            Run CDSCO Risk Analysis
                        </button>

                        <div id="result" class="mt-5 d-none">
                            <div class="result-box p-4 shadow-sm">
                                <h4 class="text-primary fw-bold" id="resClass"></h4>
                                <p class="text-muted mb-3" id="resRule"></p>
                                <div class="mb-2"><strong>Authority:</strong> <span id="resAuth"></span></div>
                                <div class="fw-bold mb-2">Required Documents:</div>
                                <ul id="resDocs" class="small text-secondary"></ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function submitLogic() {
            const data = {
                name: document.getElementById('dName').value || "Unnamed Device",
                is_invasive: document.getElementById('dInvasive').checked,
                is_active: document.getElementById('dActive').checked,
                is_life_sustaining: document.getElementById('dLife').checked,
                contacts_cns_heart: document.getElementById('dCNS').checked,
                is_sterile: false
            };

            try {
                const response = await fetch('http://127.0.0.1:8000/classify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const res = await response.json();
                
                document.getElementById('resClass').innerText = res.analysis.class + " (India)";
                document.getElementById('resRule').innerText = res.analysis.rule_applied;
                document.getElementById('resAuth').innerText = res.licensing.authority;
                
                const list = document.getElementById('resDocs');
                list.innerHTML = '';
                res.compliance_checklist.forEach(doc => {
                    let li = document.createElement('li');
                    li.innerText = doc;
                    list.appendChild(li);
                });

                document.getElementById('result').classList.remove('d-none');
            } catch (err) {
                alert("Make sure your Backend Server is running!");
            }
        }
    </script>
</body>
</html>
